<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fff8ec" />
  <title>老陈 · AI 投资人 | 副业想法验尸官</title>
  <meta name="description" content="说你的副业想法，AI 投资人老陈联网查竞品，给出愿意投多少钱的判断——或者一句白送都不要。" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤑</text></svg>" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="mascot">🤑</div>
      <div class="titles">
        <h1>老陈 · AI 投资人</h1>
        <p><span class="dot"></span>在线 · 联网查竞品 · 记得你说过的话</p>
      </div>
      <button class="icon-btn" id="reset" title="开新对话（清空记忆）" aria-label="开新对话">🔄</button>
    </header>

    <main id="messages" aria-live="polite"></main>

    <footer class="composer">
      <textarea
        id="input"
        rows="1"
        placeholder="描述你的副业想法：做什么、给谁用、怎么收钱…"
        aria-label="输入你的副业想法"
      ></textarea>
      <button class="send-btn" id="send">发出去</button>
    </footer>
    <div class="hint">Enter 发送 · Shift + Enter 换行 · 回答由 AI 生成，投资判断仅供娱乐</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
